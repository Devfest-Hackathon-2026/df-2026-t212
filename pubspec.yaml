name: afterhue
description: "Keeps only the color of each photo's subject."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.8
  http: ^1.6.0
  image: ^4.12.0
  maplibre: ^0.3.7
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  share_plus: ^13.3.1
  printing: ^5.15.1
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/samples/
    - assets/map/
